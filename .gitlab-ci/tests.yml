# .gitlab-ci/rspec-tests.yml

stages:
  - test

rspec_tests:
  stage: test
  image: ruby:3.3.10
  services:
    - name: postgres
      alias: db
    - name: redis:7.2-alpine
      alias: redis
  variables:
    RAILS_ENV: test
    POSTGRES_PASSWORD: postgres
    POSTGRES_USER: postgres
    POSTGRES_HOST_AUTH_METHOD: trust
    DATABASE_USERNAME: postgres
    DATABASE_PASSWORD: postgres
    DATABASE_HOST: db
    REDIS_URL: redis://redis:6379
    RUBYOPT: '-W:no-deprecated'
    SIMPLECOV: 1
    CODECOV: 1
  before_script:
    # Update system & install dependencies
    - apt-get update && apt-get install -y imagemagick postgresql-client
    - >
      apt-get install -y wget unzip fonts-liberation libasound2 libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0
      libcups2 libdbus-1-3 libdrm2 libgbm1 libgtk-4-1 libnspr4 libnss3 libu2f-udev libvulkan1 libxcomposite1
      libxdamage1 libxfixes3 libxkbcommon0 libxrandr2 xdg-utils
    # Chrome
    - wget -q -O chrome-linux64.zip https://bit.ly/chrome-linux64-121-0-6167-85
    - unzip chrome-linux64.zip
    - rm chrome-linux64.zip
    - mv chrome-linux64 /opt/chrome/
    - ln -s /opt/chrome/chrome /usr/local/bin/
    # Chromedriver
    - wget -q -O chromedriver-linux64.zip https://bit.ly/chromedriver-linux64-121-0-6167-85
    - unzip -j chromedriver-linux64.zip chromedriver-linux64/chromedriver
    - rm chromedriver-linux64.zip
    - mv chromedriver /usr/local/bin/
    - chrome --version
    - chromedriver --version
    # Install Bundler gems
    - gem install bundler --no-document
    - bundle install --jobs $(nproc) --retry 3
    # Install Node.js & npm packages
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    - npm ci
    # Precompile assets
    - bundle exec rake assets:precompile
    # Setup DB
    - echo "Waiting for PostgreSQL..."
    - until pg_isready -h $DATABASE_HOST -p 5432 -U $DATABASE_USERNAME; do
        echo "Postgres is unavailable - sleeping 1s";
        sleep 1;
      done
    - echo "Postgres is ready!"
    - bundle exec rails db:create db:schema:load
  script:
    - echo "Running RSpec tests..."
    - bundle exec rspec
    - echo "Linting Ruby files..."
    - bundle exec rubocop -P
  artifacts:
    when: always
    paths:
      - tmp/screenshots
      - coverage/
    reports:
      junit: tmp/rspec.xml

